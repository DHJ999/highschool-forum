<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息 · 风华正茂</title>
<link rel="stylesheet" href="css/style.css?v=70">
</head>
<body data-page="messages">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><b>风华正茂</b><span>消息</span></a>
    <div class="top-actions">
      <a class="btn btn-ghost" href="index.html">← 返回站点</a>
      <span id="authArea" style="display:flex;gap:10px;align-items:center"></span>
      <button class="icon-btn" id="btnTheme" title="切换深浅色">◐</button>
    </div>
  </div>
</header>

<div class="msg-wrap" id="msgRoot">
  <aside class="msg-contacts" id="contacts"></aside>
  <section class="msg-chat" id="chat">
    <div class="chat-empty">选择左侧会话，或从话题页点「✉ 私信」开始交流</div>
  </section>
</div>

<div class="lb" id="msgLb" hidden>
  <button class="lb-close" aria-label="关闭">✕</button><img alt="">
</div>

<script src="js/auth.js?v=70"></script>
<script src="js/messages.js?v=70"></script>
</body>
</html>
