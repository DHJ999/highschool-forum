<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号登录 · 风华正茂</title>
<link rel="stylesheet" href="css/style.css?v=58">
</head>
<body data-page="login">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><b>风华正茂</b><span>同学故事纪念站</span></a>
    <div class="top-actions">
      <a class="btn btn-ghost" href="index.html">← 返回站点</a>
      <button class="icon-btn" id="btnTheme" title="切换深浅色">◐</button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head"><h2 id="authTitle">🔒 账号登录</h2></div>
    <div class="auth-body">
      <form id="authForm">
        <div class="field"><label id="aEmailLabel">邮箱</label>
          <input id="aEmail" type="text" required placeholder="请输入邮箱"></div>
        <div class="field"><label id="aPassLabel">密码</label>
          <div class="pw-wrap">
            <input id="aPass" type="password" required minlength="6" placeholder="请输入密码（至少 6 位）">
            <button type="button" class="pw-eye" data-for="aPass" aria-label="显示密码">👁</button>
          </div></div>
        <div class="field reg-only" hidden><label>确认密码</label>
          <div class="pw-wrap">
            <input id="aPass2" type="password" required minlength="6" placeholder="再输入一次密码">
            <button type="button" class="pw-eye" data-for="aPass2" aria-label="显示密码">👁</button>
          </div></div>
        <div class="field reg-only" hidden><label>昵称</label>
          <input id="aNick" maxlength="12" placeholder="2~12 个字，将公开展示"></div>
        <div class="field reg-only" hidden><label>入学年级</label>
          <select id="aGrade"><option value="">请选择入学年级</option></select></div>
        <div class="field code-field" hidden><label>验证码</label>
          <div class="code-row">
            <input id="aCode" maxlength="6" inputmode="numeric" placeholder="6 位验证码">
            <button type="button" class="btn btn-ghost" id="btnSendCode">发送验证码</button>
          </div>
        </div>
        <p class="auth-err" id="authErr"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">登录</button>
      </form>
      <div class="auth-links">
        <p id="lnkForgotRow"><a id="lnkForgot">忘记密码？</a></p>
        <p id="lnkBackRow" hidden><a id="lnkBack">← 返回登录</a></p>
        <p class="auth-alt" id="altRow">没有账号？<a id="lnkRegister">点击这里去注册&gt;&gt;</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js?v=58"></script>
<script src="js/login.js?v=58"></script>
</body>
</html>
